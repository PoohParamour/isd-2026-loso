services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      OCR_DB_PATH: /data/transcripts.db
    volumes:
      - ./data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    environment:
      OCR_API_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

